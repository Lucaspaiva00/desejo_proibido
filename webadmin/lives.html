<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Lives</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="assets/css/admin.css"><script src="https://kit.fontawesome.com/a2e0e6ad65.js" crossorigin="anonymous"></script></head><body><div id="layout"></div><script type="module">
import {requireAdmin} from "./assets/js/auth-guard.js"; import {mountLayout,setTitle} from "./assets/js/layout.js"; import {apiFetch} from "./assets/js/api.js";
mountLayout("lives"); setTitle("Lives / Moderação"); await requireAdmin(); const root=document.getElementById("pageContent"); root.innerHTML=`<div class="d-flex gap-2 flex-wrap mb-3"><select id="fStatus" class="form-select form-select-sm" style="max-width:220px"><option>ATIVA</option><option>ENCERRADA</option><option value="TODAS">TODAS</option></select><button id="reload" class="btn btn-outline-light btn-sm">Atualizar</button></div><div class="card-dark p-3"><div id="msg" class="small text-secondary mb-2"></div><div class="table-responsive"><table class="table table-darkish align-middle"><thead><tr><th>Host</th><th>Início</th><th>Status</th><th>Online / total</th><th>Presentes</th><th>Receita plataforma</th><th>Meta</th><th>Ações</th></tr></thead><tbody id="body"></tbody></table></div></div>`;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){const st=document.getElementById("fStatus").value; const r=await apiFetch(`/admin/lives?status=${encodeURIComponent(st)}`); const arr=r?.data||[]; const b=document.getElementById("body"); b.innerHTML=arr.length?arr.map(l=>`<tr><td><div class="fw-bold">${esc(l.host?.perfil?.nome||"Sem nome")}</div><div class="small text-secondary">${esc(l.titulo||"Ao vivo")}</div></td><td>${new Date(l.criadaEm).toLocaleString("pt-BR")}</td><td><span class="badge ${l.status==="ATIVA"?"text-bg-danger":"text-bg-dark"}">${esc(l.status)}</span></td><td>${Number(l.viewersOnline||0)} / ${Number(l.totalViewers||0)}</td><td>${Number(l.presentesBrutosCreditos||0).toLocaleString("pt-BR")}</td><td>${Number(l.receitaPlataformaCreditos||0).toLocaleString("pt-BR")}</td><td>${l.metaCreditos?Number(l.metaCreditos).toLocaleString("pt-BR"):"-"}</td><td>${l.status==="ATIVA"?`<button class="btn btn-danger btn-sm" data-end="${l.id}">Encerrar</button>`:"-"}</td></tr>`).join(""):`<tr><td colspan="8" class="text-secondary">Nenhuma live.</td></tr>`; b.querySelectorAll("[data-end]").forEach(btn=>btn.onclick=()=>end(btn.dataset.end));}
async function end(id){const motivo=prompt("Motivo do encerramento:","Encerrada pela moderação")||"Encerrada pela moderação"; if(!confirm("Encerrar essa live agora?"))return; try{await apiFetch(`/admin/lives/${id}/encerrar`,{method:"POST",body:JSON.stringify({motivo})}); document.getElementById("msg").textContent="Live encerrada."; await load()}catch(e){document.getElementById("msg").textContent=e.message}}
document.getElementById("reload").onclick=load; document.getElementById("fStatus").onchange=load; await load(); setInterval(load,15000);
</script></body></html>
