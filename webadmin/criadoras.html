<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Criadoras</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="assets/css/admin.css"><script src="https://kit.fontawesome.com/a2e0e6ad65.js" crossorigin="anonymous"></script></head><body><div id="layout"></div><script type="module">
import {requireAdmin} from "./assets/js/auth-guard.js"; import {mountLayout,setTitle} from "./assets/js/layout.js"; import {apiFetch} from "./assets/js/api.js";
mountLayout("criadoras"); setTitle("Criadoras"); await requireAdmin(); const root=document.getElementById("pageContent");
root.innerHTML=`<div class="d-flex gap-2 flex-wrap mb-3"><select id="fStatus" class="form-select form-select-sm" style="max-width:220px"><option value="">Todas</option><option>PENDENTE</option><option>APROVADA</option><option>BLOQUEADA</option><option>REPROVADA</option></select><button id="reload" class="btn btn-outline-light btn-sm">Atualizar</button></div><div class="card-dark p-3"><div id="msg" class="small text-secondary mb-2"></div><div class="table-responsive"><table class="table table-darkish align-middle"><thead><tr><th>Nome</th><th>Idade</th><th>Status</th><th>Local</th><th>Saldo</th><th>Ações</th></tr></thead><tbody id="body"></tbody></table></div></div>`;
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){const st=document.getElementById("fStatus").value; const r=await apiFetch(`/admin/criadoras${st?`?status=${encodeURIComponent(st)}`:""}`); const b=document.getElementById("body"); const arr=r?.data||[]; b.innerHTML=arr.length?arr.map(u=>`<tr><td><div class="fw-bold">${esc(u.perfil?.nome||"Sem nome")}</div><div class="small text-secondary">${esc(u.email)}</div></td><td>${u.idade??"-"}</td><td><span class="badge text-bg-dark">${esc(u.creatorStatus)}</span>${u.perfil?.verificado?` <span class="badge text-bg-success">verificada</span>`:""}</td><td>${esc([u.perfil?.cidade,u.perfil?.estado].filter(Boolean).join(" / ")||"-")}</td><td>${Number(u.wallet?.saldoCreditos||0).toLocaleString("pt-BR")}</td><td><div class="d-flex flex-wrap gap-1"><button class="btn btn-success btn-sm" data-act="APROVADA" data-id="${u.id}">Aprovar</button><button class="btn btn-warning btn-sm" data-act="PENDENTE" data-id="${u.id}">Pendente</button><button class="btn btn-danger btn-sm" data-act="BLOQUEADA" data-id="${u.id}">Bloquear</button><button class="btn btn-outline-light btn-sm" data-act="REPROVADA" data-id="${u.id}">Reprovar</button></div></td></tr>`).join(""):`<tr><td colspan="6" class="text-secondary">Nenhuma conta.</td></tr>`; b.querySelectorAll("[data-act]").forEach(btn=>btn.onclick=()=>update(btn.dataset.id,btn.dataset.act));}
async function update(id,status){const motivo=prompt(`Motivo/observação para ${status}:`)||""; try{await apiFetch(`/admin/criadoras/${id}/status`,{method:"PUT",body:JSON.stringify({status,motivo})}); document.getElementById("msg").textContent=`Conta atualizada para ${status}.`; await load()}catch(e){document.getElementById("msg").textContent=e.message}}
document.getElementById("reload").onclick=load; document.getElementById("fStatus").onchange=load; await load();
</script></body></html>
