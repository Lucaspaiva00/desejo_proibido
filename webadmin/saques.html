<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Saques</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="assets/css/admin.css"><script src="https://kit.fontawesome.com/a2e0e6ad65.js" crossorigin="anonymous"></script></head><body><div id="layout"></div><script type="module">
import {requireAdmin} from "./assets/js/auth-guard.js"; import {mountLayout,setTitle} from "./assets/js/layout.js"; import {apiFetch} from "./assets/js/api.js";
mountLayout("saques"); setTitle("Saques PIX"); await requireAdmin(); const root=document.getElementById("pageContent"); root.innerHTML=`<div class="d-flex gap-2 flex-wrap mb-3"><select id="fStatus" class="form-select form-select-sm" style="max-width:220px"><option value="">Todos</option><option>PENDENTE</option><option>APROVADO</option><option>PAGO</option><option>RECUSADO</option></select><button id="reload" class="btn btn-outline-light btn-sm">Atualizar</button></div><div class="card-dark p-3"><div id="msg" class="small text-secondary mb-2"></div><div class="table-responsive"><table class="table table-darkish align-middle"><thead><tr><th>Data</th><th>Criadora</th><th>Créditos</th><th>Valor</th><th>PIX</th><th>Status</th><th>Ações</th></tr></thead><tbody id="body"></tbody></table></div></div>`;
const brl=c=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(c||0)/100); const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){const st=document.getElementById("fStatus").value; const r=await apiFetch(`/admin/saques${st?`?status=${encodeURIComponent(st)}`:""}`); const arr=r?.data||[]; const b=document.getElementById("body"); b.innerHTML=arr.length?arr.map(s=>`<tr><td>${new Date(s.solicitadoEm).toLocaleString("pt-BR")}</td><td><div class="fw-bold">${esc(s.user?.perfil?.nome||"-")}</div><div class="small text-secondary">${esc(s.user?.email||"")}</div></td><td>${Number(s.valorCreditos||0).toLocaleString("pt-BR")}</td><td>${brl(s.valorCentavos)}</td><td><span class="small">${esc(s.tipoChavePix)}<br>${esc(s.chavePix)}</span></td><td><span class="badge text-bg-dark">${esc(s.status)}</span></td><td>${["PENDENTE","APROVADO"].includes(s.status)?`<div class="d-flex flex-wrap gap-1"><button class="btn btn-warning btn-sm" data-a="APROVAR" data-id="${s.id}" ${s.status!=="PENDENTE"?"disabled":""}>Aprovar</button><button class="btn btn-success btn-sm" data-a="PAGAR" data-id="${s.id}">Marcar pago</button><button class="btn btn-danger btn-sm" data-a="RECUSAR" data-id="${s.id}">Recusar</button></div>`:"-"}</td></tr>`).join(""):`<tr><td colspan="7" class="text-secondary">Nenhum saque.</td></tr>`; b.querySelectorAll("[data-a]").forEach(btn=>btn.onclick=()=>process(btn.dataset.id,btn.dataset.a));}
async function process(id,acao){const observacao=prompt(`Observação para ${acao}:`)||""; if(acao==="PAGAR"&&!confirm("Confirma que o PIX foi efetivamente pago?"))return; try{await apiFetch(`/admin/saques/${id}`,{method:"PUT",body:JSON.stringify({acao,observacao})}); document.getElementById("msg").textContent=`Saque atualizado: ${acao}.`; await load()}catch(e){document.getElementById("msg").textContent=e.message}}
document.getElementById("reload").onclick=load; document.getElementById("fStatus").onchange=load; await load();
</script></body></html>
