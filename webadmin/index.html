<!doctype html>
<html lang="pt-br">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Dashboard</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"><link rel="stylesheet" href="assets/css/admin.css"><script src="https://kit.fontawesome.com/a2e0e6ad65.js" crossorigin="anonymous"></script></head>
<body><div id="layout"></div><script type="module">
import {requireAdmin} from "./assets/js/auth-guard.js"; import {mountLayout,setTitle} from "./assets/js/layout.js"; import {apiFetch} from "./assets/js/api.js";
mountLayout("dashboard"); setTitle("Dashboard"); await requireAdmin(); const root=document.getElementById("pageContent");
root.innerHTML=`<div class="row g-3" id="metrics"><div class="col-12 text-secondary">Carregando indicadores...</div></div><div class="row g-3 mt-1"><div class="col-12 col-lg-4"><div class="p-3 card-dark h-100"><div class="text-secondary">Atalhos operacionais</div><div class="d-grid gap-2 mt-3"><a href="lives.html" class="btn btn-danger btn-sm"><i class="fa-solid fa-video"></i> Lives ao vivo</a><a href="criadoras.html" class="btn btn-outline-light btn-sm">Criadoras pendentes</a><a href="saques.html" class="btn btn-outline-light btn-sm">Saques PIX</a><a href="denuncias.html" class="btn btn-outline-light btn-sm">Denúncias</a></div></div></div><div class="col-12 col-lg-8"><div class="p-3 card-dark"><div class="d-flex justify-content-between align-items-center"><div><div class="h6 fw-bold m-0">Últimas ações</div><div class="text-secondary small">Log administrativo</div></div><a href="acoes.html" class="btn btn-outline-light btn-sm">Ver tudo</a></div><div class="mt-3" id="ultAcoes">Carregando...</div></div></div></div>`;
const [op,r]=await Promise.all([apiFetch("/admin/dashboard-operacional"),apiFetch("/admin/acoes?page=1&limit=5")]); const metrics=[['Lives ativas',op.livesAtivas,'fa-video'],['Criadoras pendentes',op.criadorasPendentes,'fa-circle-check'],['Saques pendentes',op.saquesPendentes,'fa-money-bill-transfer'],['Receita hoje',Number(op.receitaHojeCreditos||0).toLocaleString('pt-BR')+' cr.','fa-chart-line']]; document.getElementById('metrics').innerHTML=metrics.map(x=>`<div class="col-6 col-xl-3"><div class="p-3 card-dark h-100"><div class="text-secondary small"><i class="fa-solid ${x[2]}"></i> ${x[0]}</div><div class="display-6 fw-bold mt-1">${x[1]}</div></div></div>`).join(''); const items=r?.data||[]; document.getElementById('ultAcoes').innerHTML=items.length?`<div class="table-responsive"><table class="table table-sm table-darkish"><thead><tr><th>Data</th><th>Tipo</th><th>Admin</th><th>Alvo</th></tr></thead><tbody>${items.map(a=>`<tr><td>${new Date(a.criadoEm).toLocaleString()}</td><td><span class="badge text-bg-dark">${a.tipo}</span></td><td>${a.admin?.email||'-'}</td><td>${a.alvo?.email||'-'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="text-secondary">Nenhuma ação registrada.</div>`;
</script></body></html>
